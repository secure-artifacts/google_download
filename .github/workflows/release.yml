name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      id-token: write
      contents: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build Windows executable
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name "GoogleDriveVideoDownloader-windows" google_drive_downloader.py
          New-Item -ItemType Directory -Force -Path dist_final
          Copy-Item dist\GoogleDriveVideoDownloader-windows.exe dist_final\

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist_final/*'

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist_final/*
          generate_release_notes: true
